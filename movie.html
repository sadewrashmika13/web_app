<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadew Movie Desk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --void:#0A0A0F; --void-2:#100E16;
    --crimson:#E8283F; --crimson-dim: rgba(232,40,63,.35);
    --amber:#F5A623; --amber-dim: rgba(245,166,35,.35);
    --orange:#e57b16; --orange-dim: rgba(229,123,22,.35);
    --teal:#0ea5e9; --teal-dim: rgba(14,165,233,.35);
    --violet:#7C5CFC; --violet-dim: rgba(124,92,252,.35);
    --stub:#F7F4EF; --stub-ink:#1A1720; --stub-mute:#8B8478; --text:#F3F1EE; --mute:#948FA0;
    --glass: rgba(255,255,255,0.045); --glass-brd: rgba(255,255,255,0.10);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--void); color:var(--text); font-family:'Inter',sans-serif; overflow-x:hidden; }

  .upload-banner {
    position: fixed; top: 0; left: 0; right: 0; background: rgba(16, 14, 22, 0.95);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--glass-brd); padding: 14px 20px; z-index: 1000;
    transform: translateY(-100%); transition: transform 0.4s ease;
    display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .upload-banner.show { transform: translateY(0); }
  .ub-info { display: flex; align-items: center; gap: 14px; }
  .ub-icon { width: 24px; height: 24px; color: var(--crimson); animation: spin 1s linear infinite; }
  .ub-text { display: flex; flex-direction: column; flex: 1; }
  .ub-title { font-weight: 600; font-size: 14px; color: #fff; }
  .ub-sub { font-size: 12px; color: var(--mute); margin-top: 2px; }
  .ub-progress { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; position: relative; }
  .ub-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 30%; background: var(--crimson); border-radius: 4px; animation: slide 1.5s ease-in-out infinite alternate; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes slide { 0% { left: 0; width: 30%; } 100% { left: 70%; width: 30%; } }

  header{ padding:64px 24px 28px; text-align:center; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(2.4rem,6vw,4rem); margin:10px 0 6px; }
  h1 em{ font-style:italic; color:var(--crimson); }
  .sub{ color:var(--mute); font-size:15.5px; max-width:480px; margin:0 auto 30px; }

  /* 🔥 5 SOURCES TOGGLE CSS 🔥 */
  .source-toggle{
    position:relative; display:flex; padding:4px; border-radius:999px; width:min(860px, 98vw);
    margin:0 auto; background:var(--glass); border:1px solid var(--glass-brd);
    overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
  }
  .source-toggle::-webkit-scrollbar { display: none; }
  .source-toggle .thumb{
    position:absolute; top:4px; left:4px; width:calc(20% - 1.6px); height:calc(100% - 8px);
    border-radius:999px; background:var(--crimson); transition: transform .35s ease, background .35s ease; z-index:0;
  }
  .source-toggle[data-active="cinesubz"] .thumb { transform:translateX(0%); background:var(--crimson); }
  .source-toggle[data-active="sinhalasub2"] .thumb { transform:translateX(100%); background:var(--orange); }
  .source-toggle[data-active="slcartoons"] .thumb { transform:translateX(200%); background:var(--amber); }
  .source-toggle[data-active="1tamilmv"] .thumb { transform:translateX(300%); background:var(--teal); }
  .source-toggle[data-active="animeheaven"] .thumb { transform:translateX(400%); background:var(--violet); }
  
  .src-btn{ position:relative; z-index:1; flex:1; min-width: 110px; border:none; background:transparent; cursor:pointer; padding:9px 4px; font-weight:600; font-size:11.5px; color:var(--mute); display:flex; align-items:center; justify-content:center; gap:4px; }
  .src-btn.active{ color:#fff; }

  .search-wrap{ max-width:560px; margin:26px auto 0; padding:0 20px; display:flex; gap:10px; }
  .search-box{ flex:1; padding:15px 20px; font-size:15.5px; border-radius:14px; border:1px solid var(--glass-brd); background:var(--glass); color:var(--text); outline:none; }
  .search-btn{ padding:0 22px; border-radius:14px; border:none; cursor:pointer; background:var(--crimson); color:#fff; font-weight:700; }
  
  .status{ text-align:center; margin:22px 0 0; font-size:14px; color:var(--mute); min-height:20px; }
  .container{ max-width:1080px; margin:0 auto; padding:36px 22px 90px; }
  .movie-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:22px; }

  .ticket{ cursor:pointer; border-radius:16px; overflow:hidden; background:var(--void-2); border:1px solid var(--glass-brd); transition: transform .3s ease; }
  .ticket:hover{ transform:translateY(-6px); }
  .ticket .poster{ position:relative; aspect-ratio:2/3; overflow:hidden; }
  .ticket .poster img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ticket .badge{ position:absolute; top:10px; left:10px; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.18); color:#fff; text-transform: uppercase; }
  
  .stub{ background:var(--stub); color:var(--stub-ink); padding:12px 13px 14px; }
  .stub h4{ margin:0 0 6px; font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; }

  .modal{ display:none; position:fixed; inset:0; z-index:999; background:rgba(6,5,9,.78); align-items:center; justify-content:center; padding:20px; }
  .modal.open{ display:flex; }
  .modal-card{ width:100%; max-width:420px; max-height:88vh; overflow-y:auto; border-radius:20px; background:var(--void-2); border:1px solid var(--glass-brd); }
  .modal-head{ position:relative; }
  .modal-head img{ width:100%; height:210px; object-fit:cover; display:block; }
  .close-btn{ position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.2); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .modal-title{ position:absolute; bottom:12px; left:18px; right:18px; font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:#fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
  .modal-body{ padding:20px 20px 24px; }
  .field{ width:100%; padding:12px 14px; margin-bottom:10px; border-radius:11px; border:1px solid var(--glass-brd); background:var(--glass); color:var(--text); }
  .modal-status{ font-size:13px; color:#F5C453; margin:6px 0 12px; }
  .quality-row{ display:flex; flex-wrap:wrap; gap:9px; max-height:260px; overflow-y:auto; }
  .qbtn{ padding:10px 18px; border-radius:11px; border:1px solid var(--glass-brd); background:var(--glass); color:var(--text); cursor:pointer; }
  .qbtn.all-btn{ width: 100%; background: rgba(16, 185, 129, 0.15); border-color: #10b981; color: #fff; justify-content:center;}
</style>
</head>
<body>

<div id="uploadBanner" class="upload-banner">
  <div class="ub-info">
    <svg class="ub-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg>
    <div class="ub-text">
      <div class="ub-title" id="ubTitle">Checking server queue...</div>
      <div class="ub-sub" id="ubSub">Please wait</div>
    </div>
    <button onclick="document.getElementById('uploadBanner').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;">×</button>
  </div>
  <div class="ub-progress"><div class="ub-bar"></div></div>
</div>

<header>
  <h1>Find it. Send it. <em>Done.</em></h1>
  <div class="source-toggle" id="sourceToggle" data-active="cinesubz">
    <div class="thumb"></div>
    <button class="src-btn active" data-source="cinesubz" onclick="setSource('cinesubz')">CineSubz</button>
    <button class="src-btn" data-source="sinhalasub2" onclick="setSource('sinhalasub2')">SinhalaSub API</button>
    <button class="src-btn" data-source="slcartoons" onclick="setSource('slcartoons')">SL Cartoons</button>
    <button class="src-btn" data-source="1tamilmv" onclick="setSource('1tamilmv')">1TamilMV</button>
    <button class="src-btn" data-source="animeheaven" onclick="setSource('animeheaven')">Anime Haven</button>
  </div>
  <div class="search-wrap">
    <input type="text" id="movieName" class="search-box" placeholder="Search a movie, cartoon or anime…" onkeydown="if(event.key==='Enter')searchMovie()">
    <button class="search-btn" onclick="searchMovie()">Search</button>
  </div>
  <p class="status" id="statusMsg"></p>
</header>

<div class="container"><div class="movie-grid" id="movieGrid"></div></div>

<div class="modal" id="movieModal">
  <div class="modal-card">
    <div class="modal-head">
      <button class="close-btn" onclick="closeModal()">×</button>
      <img id="modalImg" src="">
      <div class="modal-title" id="modalTitle"></div>
    </div>
    <div class="modal-body">
      <input type="text" id="reqName" class="field" placeholder="Requester Name">
      <input type="text" id="reqNum" class="field" placeholder="Phone Number (e.g. 0771234567)">
      <p class="modal-status" id="modalStatus"></p>
      <div class="quality-row" id="qualityButtons"></div>
    </div>
  </div>
</div>

<script>
  let currentSource = 'cinesubz';
  let currentMovieMeta = {};   
  let currentAnime = {};
  let currentDownloads = []; 
  
  let pollInterval = null;
  function startQueuePolling() {
      if(pollInterval) clearInterval(pollInterval);
      document.getElementById('uploadBanner').classList.add('show');
      
      pollInterval = setInterval(async () => {
          try {
              const res = await fetch('/api/queue');
              const data = await res.json();
              
              const titleEl = document.getElementById('ubTitle');
              const subEl = document.getElementById('ubSub');
              
              if(!data.active && data.queue.length === 0) {
                  titleEl.textContent = "✅ All Tasks Completed!";
                  subEl.textContent = "Your videos have been sent to the group.";
                  setTimeout(() => document.getElementById('uploadBanner').classList.remove('show'), 4000);
                  clearInterval(pollInterval);
                  return;
              }
              
              if(data.active) {
                  const myNum = document.getElementById('reqNum').value.trim();
                  const isMine = data.active.userNum === myNum;
                  
                  if (isMine) {
                      titleEl.textContent = `🚀 Sending Your Request: ${data.active.title} (${data.active.quality})`;
                      subEl.textContent = "Server is actively uploading this to WhatsApp...";
                  } else {
                      titleEl.textContent = `⏳ Waiting in Queue... (Position: ${data.queue.length + 1})`;
                      subEl.textContent = `Currently processing someone else's request: ${data.active.title}`;
                  }
              }
          } catch(e){}
      }, 3000);
  }

  function setSource(src){
    currentSource = src;
    document.getElementById('sourceToggle').setAttribute('data-active', src);
    document.querySelectorAll('.src-btn').forEach(b => b.classList.toggle('active', b.dataset.source === src));
  }

  async function searchMovie(){
    const query = document.getElementById('movieName').value.trim();
    if(!query) return;
    const statusEl = document.getElementById('statusMsg');
    statusEl.textContent = 'Searching…';
    const grid = document.getElementById('movieGrid');
    grid.innerHTML = '';
    
    try {
      const endpoint = currentSource === 'animeheaven' ? '/api/anime-search' : '/api/search';
      const res = await fetch(endpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ query, source: currentSource }) });
      const data = await res.json();

      if(data.success && data.results?.length){
        statusEl.textContent = `${data.results.length} results found`;
        data.results.forEach((mv) => {
          const card = document.createElement('div');
          card.className = 'ticket';
          card.innerHTML = `<div class="poster"><img src="${mv.img || 'https://via.placeholder.com/400'}"><span class="badge ${mv.source || 'cinesubz'}">${mv.source || 'CineSubz'}</span></div><div class="stub"><h4>${mv.title}</h4></div>`;
          card.onclick = () => openModal(mv.title, mv.img, mv.url || mv.id, mv.imdb);
          grid.appendChild(card);
        });
      } else { statusEl.textContent = 'No results found.'; }
    } catch(e){ statusEl.textContent = 'Search Error!'; }
  }

  async function openModal(title, img, refId, imdb){
    const modal = document.getElementById('movieModal');
    modal.classList.add('open');
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalImg').src = img || 'https://via.placeholder.com/400';
    document.getElementById('qualityButtons').innerHTML = '';
    const modalStatus = document.getElementById('modalStatus');
    modalStatus.textContent = 'Fetching episodes/links…';
    currentDownloads = [];

    try {
        const isAnime = currentSource === 'animeheaven';
        const res = await fetch(isAnime ? '/api/anime-episodes' : '/api/links', {
            method: 'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify(isAnime ? { id: refId } : { url: refId, source: currentSource })
        });
        const data = await res.json();

        if (data.success) {
            modalStatus.textContent = 'Pick an option:';
            currentMovieMeta = { title, img, imdb, refId };
            
            let arr = isAnime ? data.episodes : data.downloads;
            currentDownloads = arr;

            let isSeries = arr.length > 1 && (isAnime || currentSource === 'slcartoons' || arr[0].meta.toLowerCase().includes('episode') || arr[0].meta.toLowerCase().includes('part'));
            
            if (isSeries) {
                const btnAll = document.createElement('button');
                btnAll.className = 'qbtn all-btn';
                btnAll.innerHTML = `🚀 Queue ALL Episodes Automatically (${arr.length})`;
                btnAll.onclick = () => isAnime ? sendAllAnime(data) : sendAllMovie(arr);
                document.getElementById('qualityButtons').appendChild(btnAll);
            }

            arr.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = 'qbtn';
                btn.textContent = isAnime ? `Ep ${item.num}` : item.meta;
                btn.onclick = () => isAnime ? sendAnimeEpisode(data, item) : sendMovie(item.resolvedUrl, item.meta);
                document.getElementById('qualityButtons').appendChild(btn);
            });
        } else {
            modalStatus.textContent = 'No links found.';
        }
    } catch(e) { modalStatus.textContent = 'Error loading links.'; }
  }

  function closeModal(){ document.getElementById('movieModal').classList.remove('open'); }

  function getRequester(){
    const reqName = document.getElementById('reqName').value.trim();
    const reqNum = document.getElementById('reqNum').value.trim();
    if(!reqName || !reqNum){ document.getElementById('modalStatus').textContent = 'Please add requester name and number!'; return null; }
    return { reqName, reqNum };
  }

  async function sendMovie(url, quality){
    const req = getRequester(); if(!req) return;
    document.getElementById('modalStatus').textContent = `Adding to Queue...`;
    await fetch('/api/send-movie', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ title: currentMovieMeta.title, url, quality, reqName: req.reqName, reqNum: req.reqNum, source: currentSource, img: currentMovieMeta.img })
    });
    closeModal();
    startQueuePolling();
  }

  async function sendAnimeEpisode(apiData, ep){
    const req = getRequester(); if(!req) return;
    await fetch('/api/anime-send', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: currentMovieMeta.refId, hash: ep.hash, epNum: ep.num, videoname: apiData.videoname, thumbnail: apiData.thumbnail, reqName: req.reqName, reqNum: req.reqNum })
    });
    closeModal();
    startQueuePolling();
  }

  async function sendAllMovie(arr){
      const req = getRequester(); if(!req) return;
      closeModal();
      document.getElementById('uploadBanner').classList.add('show');
      document.getElementById('ubTitle').textContent = `Adding ${arr.length} episodes to Queue...`;
      
      for(let i=0; i<arr.length; i++) {
          await fetch('/api/send-movie', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({
                  title: currentMovieMeta.title, url: arr[i].resolvedUrl, quality: arr[i].meta, 
                  reqName: req.reqName, reqNum: req.reqNum, source: currentSource, img: currentMovieMeta.img,
                  batchIndex: i, batchTotal: arr.length
              })
          });
      }
      startQueuePolling();
  }

  async function sendAllAnime(apiData){
      const req = getRequester(); if(!req) return;
      closeModal();
      document.getElementById('uploadBanner').classList.add('show');
      document.getElementById('ubTitle').textContent = `Adding ${apiData.episodes.length} episodes to Queue...`;
      
      for(let i=0; i<apiData.episodes.length; i++) {
          await fetch('/api/anime-send', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({
                  id: currentMovieMeta.refId, hash: apiData.episodes[i].hash, epNum: apiData.episodes[i].num, 
                  videoname: apiData.videoname, thumbnail: apiData.thumbnail, reqName: req.reqName, reqNum: req.reqNum,
                  batchIndex: i
              })
          });
      }
      startQueuePolling();
  }
</script>
</body>
</html>
