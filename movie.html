<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadew Movie Desk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --void:#0A0A0F; --void-2:#100E16;
    --crimson:#E8283F; --crimson-dim: rgba(232,40,63,.35);
    --amber:#F5A623; --amber-dim: rgba(245,166,35,.35);
    --orange:#e57b16; --orange-dim: rgba(229,123,22,.35);
    --teal:#0ea5e9; --teal-dim: rgba(14,165,233,.35);
    --blue:#3b82f6; --blue-dim: rgba(59,130,246,.35);
    --violet:#7C5CFC; --violet-dim: rgba(124,92,252,.35);
    --pink:#E81CFF;
    --stub:#F7F4EF; --stub-ink:#1A1720; --stub-mute:#8B8478; --text:#F3F1EE; --mute:#948FA0;
    --glass: rgba(255,255,255,0.06); --glass-brd: rgba(255,255,255,0.12);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--void); color:var(--text); font-family:'Inter',sans-serif; overflow-x:hidden; position: relative;}

  /* 🍿 Popcorn Animation Background */
  .popcorn {
    position: absolute;
    top: -50px;
    font-size: 20px;
    user-select: none;
    pointer-events: none;
    animation: fall linear infinite;
    z-index: -1;
    opacity: 0.6;
  }
  @keyframes fall {
    0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }

  .upload-banner {
    position: fixed; top: 0; left: 0; right: 0; background: rgba(16, 14, 22, 0.85);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--glass-brd); padding: 14px 20px; z-index: 1000;
    transform: translateY(-100%); transition: transform 0.4s ease;
    display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .upload-banner.show { transform: translateY(0); }
  .ub-info { display: flex; align-items: center; gap: 14px; }
  .ub-icon { width: 24px; height: 24px; color: var(--crimson); animation: spin 1s linear infinite; }
  .ub-text { display: flex; flex-direction: column; flex: 1; }
  .ub-title { font-weight: 600; font-size: 14px; color: #fff; }
  .ub-sub { font-size: 12px; color: var(--mute); margin-top: 2px; }
  .ub-progress { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; position: relative; }
  .ub-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 30%; background: var(--crimson); border-radius: 4px; animation: slide 1.5s ease-in-out infinite alternate; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes slide { 0% { left: 0; width: 30%; } 100% { left: 70%; width: 30%; } }

  header{ padding:64px 24px 28px; text-align:center; position: relative; z-index: 5; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(2.4rem,6vw,4rem); margin:10px 0 6px; }
  h1 em{ font-style:italic; color:var(--crimson); }

  /* 🔥 7 SOURCES TOGGLE CSS 🔥 */
  .source-toggle{
    position:relative; display:flex; padding:4px; border-radius:999px; width:min(1000px, 98vw);
    margin:0 auto; background: rgba(255,255,255,0.03); border:1px solid var(--glass-brd);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
  }
  .source-toggle::-webkit-scrollbar { display: none; }
  .source-toggle .thumb{
    position:absolute; top:4px; left:4px; width:calc(14.285% - 1.1px); height:calc(100% - 8px);
    border-radius:999px; background:var(--crimson); transition: transform .4s cubic-bezier(0.25, 1, 0.5, 1), background .4s ease; z-index:0;
  }
  .source-toggle[data-active="cinesubz"] .thumb { transform:translateX(0%); background:var(--crimson); }
  .source-toggle[data-active="sinhalasub2"] .thumb { transform:translateX(100%); background:var(--orange); }
  .source-toggle[data-active="slcartoons"] .thumb { transform:translateX(200%); background:var(--amber); }
  .source-toggle[data-active="moviesublk"] .thumb { transform:translateX(300%); background:var(--teal); }
  .source-toggle[data-active="1tamilmv"] .thumb { transform:translateX(400%); background:var(--blue); }
  .source-toggle[data-active="animeheaven"] .thumb { transform:translateX(500%); background:var(--violet); }
  .source-toggle[data-active="kdrama"] .thumb { transform:translateX(600%); background:var(--pink); }
  
  .src-btn{ position:relative; z-index:1; flex:1; min-width: 100px; border:none; background:transparent; cursor:pointer; padding:10px 4px; font-weight:600; font-size:12px; color:var(--mute); display:flex; align-items:center; justify-content:center; gap:4px; transition: color 0.3s; }
  .src-btn.active{ color:#fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

  .search-wrap{ max-width:560px; margin:26px auto 0; padding:0 20px; display:flex; gap:10px; position: relative; z-index: 5; }
  .search-box{ flex:1; padding:15px 22px; font-size:15.5px; border-radius:14px; border:1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color:var(--text); outline:none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: border 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
  .search-box:focus { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.08); }
  .search-btn{ padding:0 24px; border-radius:14px; border:none; cursor:pointer; background:var(--crimson); color:#fff; font-weight:700; box-shadow: 0 4px 15px var(--crimson-dim); transition: transform 0.2s, box-shadow 0.2s; }
  .search-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,40,63,.5); }
  
  .status{ text-align:center; margin:22px 0 0; font-size:14px; color:var(--mute); min-height:20px; }
  
  .container{ max-width:1080px; margin:0 auto; padding:20px 22px 90px; display: flex; flex-direction: column; min-height: 50vh;}
  .movie-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:22px; margin-bottom: 40px; }

  /* Glass Card Effect */
  .ticket{ cursor:pointer; border-radius:16px; overflow:hidden; background: rgba(20, 18, 26, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border:1px solid var(--glass-brd); transition: transform .3s ease, box-shadow .3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  .ticket:hover{ transform:translateY(-8px); box-shadow: 0 12px 30px rgba(0,0,0,0.4), 0 0 15px rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
  .ticket .poster{ position:relative; aspect-ratio:2/3; overflow:hidden; }
  .ticket .poster img{ width:100%; height:100%; object-fit:cover; display:block; transition: transform 0.5s ease; }
  .ticket:hover .poster img { transform: scale(1.05); }
  .ticket .badge{ position:absolute; top:10px; left:10px; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px; background:rgba(0,0,0,.65); border:1px solid rgba(255,255,255,.2); color:#fff; backdrop-filter: blur(4px); text-transform: uppercase; z-index: 2; }
  
  .stub{ background: rgba(255,255,255,0.03); color:var(--text); padding:12px 13px 14px; border-top: 1px solid rgba(255,255,255,0.05); }
  .stub h4{ margin:0 0 6px; font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; line-height: 1.3; }

  /* WhatsApp Group Banner */
  .wa-banner-container {
    width: 100%; max-width: 600px; margin: 0 auto; text-align: center;
    background: linear-gradient(135deg, rgba(37, 211, 102, 0.1) 0%, rgba(18, 140, 126, 0.2) 100%);
    border: 1px solid rgba(37, 211, 102, 0.3);
    border-radius: 20px; padding: 25px 20px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    transition: all 0.5s ease;
    margin-top: 20px;
  }
  .wa-banner-container h2 { margin: 0 0 10px 0; font-family: 'Fraunces', serif; color: #25D366; font-size: 22px; }
  .wa-banner-container p { color: #ccc; font-size: 14.5px; margin: 0 0 20px 0; line-height: 1.5; }
  .wa-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: #25D366; color: #fff; text-decoration: none; font-weight: 700; font-size: 15px;
    padding: 12px 28px; border-radius: 999px; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .wa-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(37, 211, 102, 0.6); }

  /* Glass Modal */
  .modal{ display:none; position:fixed; inset:0; z-index:999; background:rgba(6,5,9,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); align-items:center; justify-content:center; padding:20px; opacity: 0; transition: opacity 0.3s ease; }
  .modal.open{ display:flex; opacity: 1; }
  .modal-card{ width:100%; max-width:420px; max-height:88vh; overflow-y:auto; border-radius:20px; background: rgba(20, 18, 26, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border:1px solid rgba(255,255,255,0.15); box-shadow: 0 25px 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .modal.open .modal-card { transform: scale(1); }
  
  .modal-head{ position:relative; }
  .modal-head img{ width:100%; height:210px; object-fit:cover; display:block; mask-image: linear-gradient(to bottom, black 50%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%); }
  .close-btn{ position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.2); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size: 18px; backdrop-filter: blur(4px); z-index: 10; transition: background 0.2s; }
  .close-btn:hover { background: rgba(232,40,63,.8); }
  .modal-title{ position:absolute; bottom:12px; left:18px; right:18px; font-family:'Fraunces',serif; font-weight:600; font-size:22px; color:#fff; text-shadow: 0 2px 6px rgba(0,0,0,0.9); z-index: 10; }
  .modal-body{ padding:10px 20px 24px; }
  
  .field{ width:100%; padding:14px 16px; margin-bottom:12px; border-radius:12px; border:1px solid rgba(255,255,255,0.15); background:rgba(0,0,0,0.3); color:#fff; outline:none; transition: border 0.3s; }
  .field:focus { border-color: rgba(255,255,255,0.4); }
  .modal-status{ font-size:13px; color:#F5C453; margin:6px 0 14px; text-align: center; }
  
  .quality-row{ display:flex; flex-wrap:wrap; gap:9px; max-height:260px; overflow-y:auto; padding-right: 4px; }
  .quality-row::-webkit-scrollbar { width: 6px; }
  .quality-row::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  
  .qbtn{ padding:12px 18px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:var(--text); cursor:pointer; transition: all 0.2s; flex: 1; min-width: 120px; text-align: center; font-weight: 500; }
  .qbtn:hover { background:rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }
  .qbtn.all-btn{ width: 100%; flex: 100%; background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.4)); border-color: #10b981; color: #fff; justify-content:center; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
  .qbtn.all-btn:hover { background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), rgba(16, 185, 129, 0.6)); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }
</style>
</head>
<body>

<!-- Popcorn Background Script -->
<script>
  function createPopcorn() {
    const popcorn = document.createElement('div');
    popcorn.classList.add('popcorn');
    popcorn.textContent = '🍿';
    popcorn.style.left = Math.random() * 100 + 'vw';
    popcorn.style.animationDuration = Math.random() * 3 + 4 + 's'; // 4s to 7s
    popcorn.style.fontSize = Math.random() * 10 + 15 + 'px'; // 15px to 25px
    document.body.appendChild(popcorn);
    setTimeout(() => { popcorn.remove(); }, 7000);
  }
  setInterval(createPopcorn, 400); // Create a popcorn every 400ms
</script>

<div id="uploadBanner" class="upload-banner">
  <div class="ub-info">
    <svg class="ub-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg>
    <div class="ub-text">
      <div class="ub-title" id="ubTitle">Checking server queue...</div>
      <div class="ub-sub" id="ubSub">Please wait</div>
    </div>
    <button onclick="document.getElementById('uploadBanner').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:0 5px;">×</button>
  </div>
  <div class="ub-progress"><div class="ub-bar"></div></div>
</div>

<header>
  <h1>Find it. Send it. <em>Done.</em></h1>
  <div class="source-toggle" id="sourceToggle" data-active="cinesubz">
    <div class="thumb"></div>
    <button class="src-btn active" data-source="cinesubz" onclick="setSource('cinesubz')">CineSubz</button>
    <button class="src-btn" data-source="sinhalasub2" onclick="setSource('sinhalasub2')">SinhalaSub</button>
    <button class="src-btn" data-source="slcartoons" onclick="setSource('slcartoons')">SL Cartoons</button>
    <button class="src-btn" data-source="moviesublk" onclick="setSource('moviesublk')">MovieSubLK</button>
    <button class="src-btn" data-source="1tamilmv" onclick="setSource('1tamilmv')">1TamilMV</button>
    <button class="src-btn" data-source="animeheaven" onclick="setSource('animeheaven')">AnimeHaven</button>
    <button class="src-btn" data-source="kdrama" onclick="setSource('kdrama')">KDrama (Zanta)</button>

  <div class="search-wrap">
    <input type="text" id="movieName" class="search-box" placeholder="Search a movie, cartoon or anime…" onkeydown="if(event.key==='Enter')searchMovie()">
    <button class="search-btn" onclick="searchMovie()">Search</button>

</header>

<div class="container">
  <!-- Movie Grid for Results -->
  <div class="movie-grid" id="movieGrid"></div>
  
  <!-- WhatsApp Banner (Sits below grid. When grid is empty, it acts like a welcome banner) -->

<div class="modal" id="movieModal">
  <div class="modal-card">
    <div class="modal-head">
      <button class="close-btn" onclick="closeModal()">×</button>
      <img id="modalImg" src="">
      <div class="modal-title" id="modalTitle"></div>
    </div>
    <div class="modal-body">
      <input type="text" id="reqName" class="field" placeholder="Requester Name (E.g. Sadew)">
      <input type="text" id="reqNum" class="field" placeholder="Phone Number (e.g. 0771234567)">
      <p class="modal-status" id="modalStatus"></p>
      <div class="quality-row" id="qualityButtons"></div>
    </div>
  </div>
</div>

<script>
  let currentSource = 'cinesubz';
  let currentMovieMeta = {};   
  let currentDownloads = []; 
  
  let pollInterval = null;
  function startQueuePolling() {
      if(pollInterval) clearInterval(pollInterval);
      document.getElementById('uploadBanner').classList.add('show');
      
      pollInterval = setInterval(async () => {
          try {
              const res = await fetch('/api/queue');
              const data = await res.json();
              
              const titleEl = document.getElementById('ubTitle');
              const subEl = document.getElementById('ubSub');
              
              if(!data.active && data.queue.length === 0) {
                  titleEl.textContent = "✅ All Tasks Completed!";
                  subEl.textContent = "Your videos have been sent to the group.";
                  setTimeout(() => document.getElementById('uploadBanner').classList.remove('show'), 4000);
                  clearInterval(pollInterval);
                  return;
              }
              
              if(data.active) {
                  const myNum = document.getElementById('reqNum').value.trim();
                  const isMine = data.active.userNum === myNum;
                  
                  if (isMine) {
                      titleEl.textContent = `🚀 Sending Your Request: ${data.active.title} (${data.active.quality})`;
                      subEl.textContent = "Server is actively uploading this to WhatsApp...";
                  } else {
                      titleEl.textContent = `⏳ Waiting in Queue... (Position: ${data.queue.length + 1})`;
                      subEl.textContent = `Currently processing someone else's request: ${data.active.title}`;
                  }
              }
          } catch(e){}
      }, 3000);
  }

  function setSource(src){
    currentSource = src;
    document.getElementById('sourceToggle').setAttribute('data-active', src);
    document.querySelectorAll('.src-btn').forEach(b => b.classList.toggle('active', b.dataset.source === src));
  }

  async function searchMovie(){
    const query = document.getElementById('movieName').value.trim();
    if(!query) return;
    const statusEl = document.getElementById('statusMsg');
    statusEl.textContent = 'Searching…';
    const grid = document.getElementById('movieGrid');
    grid.innerHTML = '';
    
    try {
      const endpoint = currentSource === 'animeheaven' ? '/api/anime-search' : '/api/search';
      const res = await fetch(endpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ query, source: currentSource }) });
      const data = await res.json();

      if(data.success && data.results?.length){
        statusEl.textContent = `${data.results.length} results found`;
        data.results.forEach((mv) => {
          const card = document.createElement('div');
          card.className = 'ticket';
          card.innerHTML = `<div class="poster"><img src="${mv.img || 'https://via.placeholder.com/400'}"><span class="badge ${mv.source || 'cinesubz'}">${mv.source || 'CineSubz'}</span></div><div class="stub"><h4>${mv.title}</h4></div>`;
          card.onclick = () => openModal(mv.title, mv.img, mv.url || mv.id, mv.imdb);
          grid.appendChild(card);
        });
      } else { statusEl.textContent = 'No results found.'; }
    } catch(e){ statusEl.textContent = 'Search Error!'; }
  }

  async function openModal(title, img, refId, imdb){
    const modal = document.getElementById('movieModal');
    modal.classList.add('open');
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalImg').src = img || 'https://via.placeholder.com/400';
    document.getElementById('qualityButtons').innerHTML = '';
    const modalStatus = document.getElementById('modalStatus');
    modalStatus.textContent = 'Fetching episodes/links…';
    currentDownloads = [];

    try {
        const isAnime = currentSource === 'animeheaven';
        const res = await fetch(isAnime ? '/api/anime-episodes' : '/api/links', {
            method: 'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify(isAnime ? { id: refId } : { url: refId, source: currentSource })
        });
        const data = await res.json();

        if (data.success) {
            modalStatus.textContent = 'Pick an option:';
            currentMovieMeta = { title, img, imdb, refId };
            
            let arr = isAnime ? data.episodes : data.downloads;
            currentDownloads = arr;

            let isSeries = arr.length > 1 && (isAnime || currentSource === 'slcartoons' || currentSource === 'moviesublk' || currentSource === 'kdrama' || arr[0].meta.toLowerCase().includes('episode') || arr[0].meta.toLowerCase().includes('part'));
            
            if (isSeries) {
                const btnAll = document.createElement('button');
                btnAll.className = 'qbtn all-btn';
                btnAll.innerHTML = `🚀 Queue ALL Episodes Automatically (${arr.length})`;
                btnAll.onclick = () => isAnime ? sendAllAnime(data) : sendAllMovie(arr);
                document.getElementById('qualityButtons').appendChild(btnAll);
            }

            arr.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = 'qbtn';
                btn.textContent = isAnime ? `Ep ${item.num}` : item.meta;
                btn.onclick = () => isAnime ? sendAnimeEpisode(data, item) : sendMovie(item.resolvedUrl, item.meta);
                document.getElementById('qualityButtons').appendChild(btn);
            });
        } else {
            modalStatus.textContent = 'No links found.';
        }
    } catch(e) { modalStatus.textContent = 'Error loading links.'; }
  }

  function closeModal(){ document.getElementById('movieModal').classList.remove('open'); }

  function getRequester(){
    const reqName = document.getElementById('reqName').value.trim();
    const reqNum = document.getElementById('reqNum').value.trim();
    if(!reqName || !reqNum){ document.getElementById('modalStatus').textContent = 'Please add requester name and number!'; return null; }
    return { reqName, reqNum };
  }

  async function sendMovie(url, quality){
    const req = getRequester(); if(!req) return;
    document.getElementById('modalStatus').textContent = `Adding to Queue...`;
    await fetch('/api/send-movie', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ title: currentMovieMeta.title, url, quality, reqName: req.reqName, reqNum: req.reqNum, source: currentSource, img: currentMovieMeta.img })
    });
    closeModal();
    startQueuePolling();
  }

  async function sendAnimeEpisode(apiData, ep){
    const req = getRequester(); if(!req) return;
    await fetch('/api/anime-send', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: currentMovieMeta.refId, hash: ep.hash, epNum: ep.num, videoname: apiData.videoname, thumbnail: apiData.thumbnail, reqName: req.reqName, reqNum: req.reqNum })
    });
    closeModal();
    startQueuePolling();
  }

  async function sendAllMovie(arr){
      const req = getRequester(); if(!req) return;
      closeModal();
      document.getElementById('uploadBanner').classList.add('show');
      document.getElementById('ubTitle').textContent = `Adding ${arr.length} videos to Queue...`;
      
      for(let i=0; i<arr.length; i++) {
          await fetch('/api/send-movie', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({
                  title: currentMovieMeta.title, url: arr[i].resolvedUrl, quality: arr[i].meta, 
                  reqName: req.reqName, reqNum: req.reqNum, source: currentSource, img: currentMovieMeta.img,
                  batchIndex: i, batchTotal: arr.length
              })
          });
      }
      startQueuePolling();
  }

  async function sendAllAnime(apiData){
      const req = getRequester(); if(!req) return;
      closeModal();
      document.getElementById('uploadBanner').classList.add('show');
      document.getElementById('ubTitle').textContent = `Adding ${apiData.episodes.length} episodes to Queue...`;
      
      for(let i=0; i<apiData.episodes.length; i++) {
          await fetch('/api/anime-send', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({
                  id: currentMovieMeta.refId, hash: apiData.episodes[i].hash, epNum: apiData.episodes[i].num, 
                  videoname: apiData.videoname, thumbnail: apiData.thumbnail, reqName: req.reqName, reqNum: req.reqNum,
                  batchIndex: i
              })
          });
      }
      startQueuePolling();
  }
</script>
</body>
