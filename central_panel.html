<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SADEW-MINI | Central Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:       #06000f;
            --glass-bg: rgba(139,92,246,0.05);
            --glass-border: rgba(139,92,246,0.18);
            --text:     #e9e0ff;
            --muted:    rgba(196,181,253,0.45);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ─── BACKGROUND SCENE ─── */
        #bg-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        #bg-scene::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse 70% 55% at 15% 30%, rgba(120,40,220,0.18) 0%, transparent 65%),
                        radial-gradient(ellipse 55% 45% at 85% 75%, rgba(80,10,160,0.14) 0%, transparent 65%),
                        var(--bg);
            animation: bgBreath 10s ease-in-out infinite alternate;
        }
        @keyframes bgBreath { from { opacity: 0.75; } to { opacity: 1; } }

        .grid-overlay {
            position: absolute; inset: -50px;
            background-image: radial-gradient(circle, rgba(139,92,246,0.12) 1px, transparent 1px);
            background-size: 40px 40px; animation: gridDrift 25s linear infinite;
        }
        @keyframes gridDrift { from { transform: translate(0,0); } to { transform: translate(40px, 40px); } }

        .content { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 36px 24px 60px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .logo { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; line-height: 1; }
        .logo .l-white { color: #ede9ff; }
        .logo .l-purple { background: linear-gradient(120deg, #c084fc, #9333ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-sub { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 4px;}
        .dot-live { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.8); animation: livePulse 2s infinite; }
        @keyframes livePulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

        .btn-primary {
            background: linear-gradient(135deg, #9333ea 0%, #dc2626 100%); border: none; color: #fff;
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; padding: 11px 26px;
            border-radius: 100px; cursor: pointer; transition: transform 0.25s, box-shadow 0.25s;
            box-shadow: 0 0 20px rgba(147,51,234,0.45);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 35px rgba(147,51,234,0.65); }

        .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(139,92,246,0.25) 30%, rgba(220,38,38,0.2) 70%, transparent); margin: 24px 0 40px; }

        .stat-bar { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
        .stat-chip { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 100px; padding: 7px 16px; font-size: 0.75rem; font-weight: 600; color: var(--muted); display: flex; gap: 6px; }
        .stat-chip .val { color: #c084fc; }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; }
        
        .admin-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 22px;
            padding: 30px 22px 22px; cursor: pointer; position: relative; transition: all 0.3s;
        }
        .admin-card:hover { transform: translateY(-8px); border-color: rgba(220,38,38,0.35); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .card-avatar { width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(135deg, rgba(147,51,234,0.2), rgba(220,38,38,0.15)); border: 1px solid rgba(139,92,246,0.25); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 18px; }
        .card-id { font-size: 0.95rem; font-weight: 700; text-align: center; text-transform: uppercase; color: #ede9ff; margin-bottom: 18px; }
        .card-info-row { display: flex; align-items: center; gap: 8px; background: rgba(139,92,246,0.06); border: 1px solid rgba(139,92,246,0.1); border-radius: 8px; padding: 7px 10px; margin-bottom: 8px; font-size: 0.75rem; color: var(--muted); }

        .new-card { background: rgba(139,92,246,0.025); border: 2px dashed rgba(139,92,246,0.2); border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px; cursor: pointer; transition: all 0.3s; }
        .new-card:hover { border-color: rgba(220,38,38,0.45); background: rgba(220,38,38,0.04); transform: translateY(-4px); }
        .new-card-plus { font-size: 2rem; color: rgba(139,92,246,0.4); margin-bottom: 10px; }

        /* SETTINGS PANEL */
        .settings-panel { max-width: 480px; margin: 0 auto; background: rgba(139,92,246,0.04); border: 1px solid rgba(139,92,246,0.15); border-radius: 26px; padding: 44px 40px; backdrop-filter: blur(20px); }
        .settings-title { font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 30px; background: linear-gradient(120deg, #c084fc, #e879f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .field-group { margin-bottom: 18px; }
        .field-label { display: block; font-size: 0.72rem; font-weight: 600; color: rgba(196,181,253,0.6); text-transform: uppercase; margin-bottom: 8px; }
        .field-input { width: 100%; background: rgba(10,2,25,0.8); border: 1px solid rgba(139,92,246,0.18); border-radius: 12px; padding: 13px 16px; color: #ede9ff; font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; outline: none; }
        .field-input:focus { border-color: rgba(220,38,38,0.45); box-shadow: 0 0 15px rgba(220,38,38,0.1); }

        .btn-row { display: flex; gap: 14px; margin-top: 30px; }
        .btn-cancel { flex: 1; background: rgba(139,92,246,0.07); border: 1px solid rgba(139,92,246,0.18); color: rgba(196,181,253,0.65); padding: 13px; border-radius: 12px; cursor: pointer; }
        .btn-save { flex: 1.4; background: linear-gradient(135deg, #7c3aed, #dc2626); border: none; color: #fff; padding: 13px; border-radius: 12px; font-weight: 700; cursor: pointer; }

        .hidden { display: none !important; }
    </style>
    
    <!-- 🔥 Security Check 🔥 -->
    <script>
        if (!sessionStorage.getItem('sadew_auth') || sessionStorage.getItem('sadew_user') !== 'sadew') {
            window.location.href = '/portal'; 
        }
    </script>
</head>
<body>

    <div id="bg-scene">
        <div class="grid-overlay"></div>
    </div>

    <main class="content">
        <header>
            <div class="logo-wrap">
                <div class="logo"><span class="l-white">SADEW</span><span class="l-purple">·MINI</span> <span class="l-red">✦</span></div>
                <div class="logo-sub"><span class="dot-live"></span> Central Panel · Live System</div>
            </div>
            <button id="addNewBtn" onclick="prepareNewAdmin()" class="btn-primary">+ Add New Admin</button>
        </header>

        <div class="divider"></div>

        <!-- DASHBOARD VIEW -->
        <section id="dashboardView">
            <div class="stat-bar" id="statBar"></div>
            <div class="cards-grid" id="cardsGrid"></div>
        </section>

        <!-- SETTINGS VIEW -->
        <section id="settingsView" class="hidden">
            <div class="settings-panel">
                <h2 class="settings-title" id="settingsTitle">Create New Admin</h2>

                <div class="field-group">
                    <label class="field-label">👤 Admin ID (Username)</label>
                    <input type="text" id="adminIdInput" class="field-input" placeholder="e.g. admin_03">
                </div>

                <div class="field-group">
                    <label class="field-label">🔑 Password</label>
                    <input type="text" id="passwordInput" class="field-input" placeholder="e.g. nimal123">
                </div>

                <div class="field-group">
                    <label class="field-label">📞 Bot WhatsApp Number (Optional)</label>
                    <input type="text" id="botNumberInput" class="field-input" placeholder="e.g. 9470523...">
                </div>

                <div class="field-group">
                    <label class="field-label">🔗 Group JID (Optional)</label>
                    <input type="text" id="groupJidInput" class="field-input" placeholder="e.g. 12036...@g.us">
                </div>

                <div class="btn-row">
                    <button class="btn-cancel" onclick="showDashboard()">Cancel</button>
                    <button class="btn-save" onclick="saveAdmin()">💾 Save to Database</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        let adminsData = [];

        // 1. Database එකෙන් ඇඩ්මින්ලාව ගන්නවා
        async function fetchAdmins() {
            try {
                const res = await fetch('/api/admins');
                const data = await res.json();
                if (data.success) {
                    adminsData = data.admins;
                    renderDashboard();
                }
            } catch (err) {
                console.error("Error fetching admins", err);
            }
        }

        function renderDashboard() {
            const grid = document.getElementById('cardsGrid');
            const stats = document.getElementById('statBar');
            grid.innerHTML = '';

            stats.innerHTML = `
                <div class="stat-chip">Total Admins <span class="val">${adminsData.length}</span></div>
                <div class="stat-chip">Database <span class="val">Connected ✅</span></div>
            `;

            adminsData.forEach(admin => {
                const card = document.createElement('div');
                card.className = 'admin-card';
                card.onclick = () => editAdmin(admin);
                card.innerHTML = `
                    <div class="card-avatar">👤</div>
                    <div class="card-id">${admin.username.toUpperCase()}</div>
                    <div class="card-info-row">📞 ${admin.bot_number || 'Not Set'}</div>
                    <div class="card-info-row">🔗 ${admin.group_jid ? 'Group Added' : 'No Group'}</div>
                    <div class="card-info-row">🔑 Pass: ${admin.password}</div>
                `;
                grid.appendChild(card);
            });

            const newCard = document.createElement('div');
            newCard.className = 'new-card';
            newCard.onclick = prepareNewAdmin;
            newCard.innerHTML = `<div class="new-card-plus">+</div><div>Create New Admin</div>`;
            grid.appendChild(newCard);
        }

        function prepareNewAdmin() {
            const nextId = 'admin_' + String(adminsData.length + 1).padStart(2, '0');
            document.getElementById('adminIdInput').value = nextId;
            document.getElementById('passwordInput').value = '';
            document.getElementById('botNumberInput').value = '';
            document.getElementById('groupJidInput').value = '';
            document.getElementById('settingsTitle').textContent = 'Create New Admin';
            showSettingsView();
        }

        function editAdmin(admin) {
            document.getElementById('adminIdInput').value = admin.username;
            document.getElementById('passwordInput').value = admin.password;
            document.getElementById('botNumberInput').value = admin.bot_number;
            document.getElementById('groupJidInput').value = admin.group_jid;
            document.getElementById('settingsTitle').textContent = 'Edit Admin Details';
            showSettingsView();
        }

        // 2. අලුත් ඇඩ්මින්ව Database එකට සේව් කරනවා
        async function saveAdmin() {
            const adminId = document.getElementById('adminIdInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const botNumber = document.getElementById('botNumberInput').value.trim();
            const groupJid = document.getElementById('groupJidInput').value.trim();
            const btn = document.querySelector('.btn-save');

            if (!adminId || !password) {
                alert('⚠️ Username and Password are required!');
                return;
            }

            btn.innerHTML = '⏳ Saving...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/admin/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: adminId,
                        password: password,
                        bot_number: botNumber,
                        group_jid: groupJid
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    alert('✅ ' + data.message);
                    await fetchAdmins(); // Database එකෙන් ආයෙත් අලුත් ලිස්ට් එක ගන්නවා
                    showDashboard();
                } else {
                    alert('❌ Error: ' + data.message);
                }
            } catch (err) {
                alert('⚠️ Network Error!');
            } finally {
                btn.innerHTML = '💾 Save to Database';
                btn.disabled = false;
            }
        }

        function showSettingsView() {
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('addNewBtn').classList.add('hidden');
            document.getElementById('settingsView').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('settingsView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            document.getElementById('addNewBtn').classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', fetchAdmins);
    </script>
</body>
</html>
